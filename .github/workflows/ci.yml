name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both jobs talk to a real Postgres (Sprint 74, founder decision D-74.2). The
# pgvector image is what the evidence store's HNSW index needs; the stock
# postgres image would fail the baseline migration at CREATE EXTENSION.
env:
  DATABASE_URL: postgres://tuezday:tuezday@localhost:5432/tuezday

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tuezday
          POSTGRES_PASSWORD: tuezday
          POSTGRES_DB: tuezday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tuezday -d tuezday"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Sprint 67 (D-67.8): the replay harness's golden suite. Blocks the merge on a
  # metric regression, a broken context invariant, or a moved prompt/resolver
  # digest. Intentional prompt changes are accepted with `npm run eval:record`.
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tuezday
          POSTGRES_PASSWORD: tuezday
          POSTGRES_DB: tuezday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tuezday -d tuezday"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval
